name: LEGISTA Notifications

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  run-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: check deadlines daily
        if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
        run: npm run notify:deadlines
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: check messages every 30 min
        if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
        run: npm run notify:messages
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
