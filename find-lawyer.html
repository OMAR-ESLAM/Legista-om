<style>
  :root {
    color-scheme: dark;
    --background: oklch(0.17 0.008 60);
    --foreground: oklch(0.97 0.005 80);
    --card: oklch(0.21 0.01 60);
    --border: oklch(1 0 0 / 12%);
    --muted-foreground: oklch(0.72 0.01 70);
    --secondary: oklch(0.27 0.01 60);
    --secondary-foreground: oklch(0.97 0.005 80);
    --primary-foreground: oklch(0.2 0.02 70);
    --gold: oklch(0.78 0.1 82);
    --gold-soft: oklch(0.85 0.08 85);
    --radius: 0.75rem;
  }
  body { font-family: 'Cairo', sans-serif; background: var(--background); color: var(--foreground); }
  .bg-app { background: var(--background); }
  .bg-card-c { background: var(--card); }
  .bg-secondary-c { background: var(--secondary); }
  .bg-gold-c { background: var(--gold); }
  .text-fg { color: var(--foreground); }
  .text-muted-c { color: var(--muted-foreground); }
  .text-gold-c { color: var(--gold); }
  .text-gold-soft-c { color: var(--gold-soft); }
  .text-secondary-fg-c { color: var(--secondary-foreground); }
  .text-primary-fg-c { color: var(--primary-foreground); }
  .border-app { border-color: var(--border); }
  [data-lucide] { width: 1em; height: 1em; }
  ::placeholder { color: var(--muted-foreground); opacity: .8; }
  .lawyer-card { transition: border-color .3s ease; }
  .chip-active { background: var(--gold); color: var(--primary-foreground); }
  .chip-inactive { background: color-mix(in oklch, var(--card) 60%, transparent); border: 1px solid var(--border); color: color-mix(in oklch, var(--foreground) 80%, transparent); }
  .chip-inactive:hover { border-color: color-mix(in oklch, var(--gold) 40%, transparent); }
  .modal-overlay { backdrop-filter: blur(4px); }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Wave background */
  .wave-band { position: absolute; inset-inline: 0; top: 10%; height: 42%; overflow: hidden; pointer-events: none; }
  .wave-bob { position: absolute; inset: -20% 0; animation: waveBob 7s ease-in-out infinite; }
  .wave-track { position: absolute; top: 0; right: 0; height: 100%; width: 200%; display: flex; animation: waveScroll 22s linear infinite; }
  .wave-track svg { height: 100%; width: 50%; flex-shrink: 0; }
  @keyframes waveScroll {
    from { transform: translateX(0); }
    to { transform: translateX(50%); }
  }
  @keyframes waveBob {
    0%   { transform: translateY(0) scaleY(1); }
    25%  { transform: translateY(-10px) scaleY(1.06); }
    50%  { transform: translateY(4px) scaleY(0.96); }
    75%  { transform: translateY(-6px) scaleY(1.03); }
    100% { transform: translateY(0) scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wave-track, .wave-bob { animation: none; }
  }

  /* Stardust / glitter cascading down behind headline */
  .stardust { position: absolute; inset-inline: 0; top: 0; height: 50%; overflow: hidden; pointer-events: none; }
  .dust-dot {
    position: absolute; border-radius: 9999px;
    animation: dustFall var(--fall-dur) ease-in infinite;
    animation-delay: var(--delay);
    box-shadow: 0 0 var(--blur) currentColor, 0 0 calc(var(--blur) * 2) currentColor;
    opacity: 0;
  }
  @keyframes dustFall {
    0%   { opacity: 0; transform: translateY(-14px) scale(0.6); }
    12%  { opacity: var(--op-max); transform: translateY(0) scale(1); }
    70%  { opacity: var(--op-max); transform: translateY(calc(var(--drift) * 0.7)) scale(1); }
    100% { opacity: 0; transform: translateY(var(--drift)) scale(0.7); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dust-dot { animation: none; opacity: var(--op-max); }
  }
</style>

  </div>

<script type="module">
import './case-widget.js';

const CATEGORY_ICONS = { all: 'layout-grid', rent: 'building-2', labor: 'briefcase', criminal: 'scale', family: 'users', contracts: 'file-text', commercial: 'landmark', other: 'more-horizontal' };

let allLawyers = [];
let activeCategory = 'all';
let modalLawyerEmail = null;

function categoryLabel(key) {
  const c = window.CaseWidget.LEAD_CATEGORIES.find(x => x.key === key);
  return c ? c.label : key;
}

function renderChips() {
  const row = document.getElementById('chipRow');
  const cats = [{ key: 'all', label: 'الكل' }, ...window.CaseWidget.LEAD_CATEGORIES];
  row.innerHTML = cats.map(c => {
    const active = c.key === activeCategory;
    const cls = active ? 'chip-active' : 'chip-inactive';
    return `<button type="button" class="chip flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold ${cls}" data-key="${c.key}">
      <span>${window.CaseWidget.escapeHTML(c.label)}</span>
      <i data-lucide="${CATEGORY_ICONS[c.key] || 'tag'}" style="width:14px;height:14px;"></i>
    </button>`;
  }).join('');
  row.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeCategory = chip.dataset.key;
      renderChips();
      applyFilters();
    });
  });
  lucide.createIcons();
}

function renderCities() {
  const sel = document.getElementById('citySelect');
  window.CaseWidget.EGYPT_GOVERNORATES.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    document.querySelector('#cityLabel span').textContent = sel.value || 'كل المحافظات';
    applyFilters();
  });
}

function applyFilters() {
  const searchTerm = document.getElementById('descInput').value.trim().toLowerCase();
  const city = document.getElementById('citySelect').value;

  const filtered = allLawyers.filter(l => {
    if (activeCategory !== 'all' && !(l.publicProfile?.specialties || []).includes(activeCategory)) return false;
    if (city && l.publicProfile?.city !== city) return false;
    if (searchTerm) {
      const hay = [(l.name || ''), ...(l.publicProfile?.specialties || []).map(categoryLabel), (l.publicProfile?.bio || '')].join(' ').toLowerCase();
      if (!hay.includes(searchTerm)) return false;
    }
    return true;
  });

  renderGrid(filtered);
}

function renderGrid(lawyers) {
  const grid = document.getElementById('lawyerGrid');
  document.getElementById('resultsCount').textContent = lawyers.length ? `${lawyers.length} محامي متاح` : '';

  if (!lawyers.length) {
    grid.innerHTML = `<div class="col-span-full text-center py-16 border border-dashed border-app rounded-2xl text-muted-c text-sm leading-loose">
      <div class="text-4xl mb-3">🧑‍⚖️</div>
      لسه مفيش محامين متسجّلين في التصنيف أو المحافظة دي — جرّب تصنيف تاني أو رجّع "الكل".
    </div>`;
    return;
  }

  grid.innerHTML = lawyers.map((l) => {
    const specialties = l.publicProfile?.specialties || [];
    const specialtyLine = specialties.length ? specialties.map(categoryLabel).join(' - ') : 'محامي مسجّل على LEGISTA';
    const isBook = Math.random() > 0.5; // شكل الزرار بس (كتابة/حجز)، الاتنين بيبعتوا نفس الطلب فعليًا
    return `
    <article class="lawyer-card group flex flex-col overflow-hidden rounded-2xl border-app bg-card-c/70 backdrop-blur-sm border">
      <div class="relative aspect-[4/5] w-full overflow-hidden bg-secondary-c flex items-center justify-center">
        <i data-lucide="scale" class="text-gold-c" style="width:34px;height:34px;"></i>
        <div class="absolute inset-0" style="background:linear-gradient(to top, var(--card), color-mix(in oklch, var(--card) 10%, transparent), transparent);"></div>
      </div>
      <div class="flex flex-1 flex-col gap-2 px-3 pb-3 pt-1 text-center">
        <div class="flex items-center justify-center gap-1.5">
          <i data-lucide="star" class="text-gold-c" style="width:13px;height:13px;"></i>
          <h3 class="text-sm font-bold text-fg">${window.CaseWidget.escapeHTML(l.name || 'محامي')}</h3>
        </div>
        <p class="text-xs leading-relaxed text-muted-c">${window.CaseWidget.escapeHTML(specialtyLine)}</p>
        ${l.publicProfile?.city ? `<div class="flex items-center justify-center gap-1 text-xs text-muted-c">
          <i data-lucide="map-pin" style="width:12px;height:12px;"></i><span>${window.CaseWidget.escapeHTML(l.publicProfile.city)}</span>
        </div>` : ''}
        <button class="lc-action mt-1 w-full rounded-md px-3 py-2 text-xs font-semibold ${isBook ? 'text-white' : 'border-app border bg-secondary-c/60 text-fg'}"
          style="${isBook ? 'background:#2f6bd6;' : ''}"
          data-email="${l.email}" data-name="${window.CaseWidget.escapeHTML(l.name || 'محامي')}" data-label="${isBook ? 'حجز استشارة' : 'تواصل'}">
          ${isBook ? 'حجز استشارة' : 'تواصل'}
        </button>
        <p class="mt-1 text-[10px] leading-relaxed text-muted-c/70">من ضمن الشبكة المسجّلة على LEGISTA</p>
      </div>
    </article>`;
  }).join('');

  grid.querySelectorAll('.lc-action').forEach(btn => {
    btn.addEventListener('click', () => openModal(btn.dataset.email, btn.dataset.name, btn.dataset.label));
  });
  lucide.createIcons();
}

function openModal(email, name, actionLabel) {
  modalLawyerEmail = email;
  document.getElementById('modalLawyerName').textContent = name;
  document.getElementById('modalActionLabel').textContent = actionLabel + ' — اكتب طلبك وهيتواصل معاك على رقمك';
  document.getElementById('mName').value = '';
  document.getElementById('mPhone').value = '';
  document.getElementById('mDesc').value = '';
  document.getElementById('mErr').textContent = '';
  const btn = document.getElementById('mSubmit');
  btn.textContent = 'ابعت الطلب';
  btn.disabled = false;
  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('modalOverlay').classList.add('flex');
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });
function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalOverlay').classList.remove('flex');
}

document.getElementById('mSubmit').addEventListener('click', async () => {
  const name = document.getElementById('mName').value.trim();
  const phone = document.getElementById('mPhone').value.trim();
  const description = document.getElementById('mDesc').value.trim();
  if (!name) { document.getElementById('mErr').textContent = 'اكتب اسمك'; return; }
  if (!phone || phone.length < 10) { document.getElementById('mErr').textContent = 'اكتب رقم موبايل صحيح'; return; }
  if (!description) { document.getElementById('mErr').textContent = 'اكتب مشكلتك باختصار'; return; }

  const btn = document.getElementById('mSubmit');
  btn.disabled = true;
  const lead = await window.CaseWidget.submitLeadRequest({ name, phone, description, category: activeCategory === 'all' ? 'other' : activeCategory, city: document.getElementById('citySelect').value });
  await window.CaseWidget.assignLeadToLawyer(lead.id, modalLawyerEmail);
  btn.textContent = 'تم الإرسال ✓';
  setTimeout(closeModal, 1200);
});

document.getElementById('descInput').addEventListener('input', applyFilters);

async function boot() {
  try {
    allLawyers = await window.CaseWidget.listAllPublicLawyers();
    renderChips();
    renderCities();
    applyFilters();
  } catch (e) {
    console.error('find-lawyer boot error', e);
    document.getElementById('lawyerGrid').innerHTML = `<div class="col-span-full text-center py-16 text-red-400 text-sm">⚠️ حصل خطأ في تحميل الصفحة — تأكد إن case-widget.js عندك آخر نسخة، أو حدّث الصفحة.</div>`;
  }
  lucide.createIcons();
}
boot();
</script>
