<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دور على محاميك | LEGISTA</title>
<meta name="description" content="تصفّح محامين متخصصين قريبين منك وابعتله طلبك على طول.">
<meta name="theme-color" content="#FAF8F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF8F4; --panel: #FFFFFF; --ink: #12181F;
  --navy: #1E3A5F; --navy-deep: #142942; --navy-soft: #EAF0F6;
  --gold: #C9A227; --gold-soft: #F4E7BE;
  --gray: #6B7280; --gray-soft: #98A1AC; --border: #E7E2D6;
  --success: #1F9D73;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);}
a{color:inherit;}

/* ═══ top bar ═══ */
.top-nav{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:200;}
.nav-logo{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;letter-spacing:4px;color:var(--navy-deep);text-decoration:none;}
.nav-logo span{color:var(--gold);}
.nav-sub{font-size:11.5px;color:var(--gray);font-weight:600;}

/* ═══ search header ═══ */
.search-head{background:linear-gradient(160deg,var(--navy-soft) 0%,var(--bg) 100%);border-bottom:1px solid var(--border);padding:36px 20px 28px;}
.search-inner{max-width:1080px;margin:0 auto;}
.search-inner h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:16px;color:var(--navy-deep);}
.search-inner h1 span{color:var(--gold);}
.search-bar{display:flex;gap:10px;flex-wrap:wrap;}
.search-bar input, .search-bar select{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--ink);font-family:'Cairo',sans-serif;font-size:13.5px;outline:none;direction:rtl;}
.search-bar input{flex:2;min-width:180px;}
.search-bar select{flex:1;min-width:140px;}
.search-bar input:focus, .search-bar select:focus{border-color:var(--navy);}

/* ═══ category chips ═══ */
.chip-row{max-width:1080px;margin:0 auto;padding:18px 20px 0;display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--panel);border:1px solid var(--border);color:var(--gray);padding:9px 17px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .2s;}
.chip:hover{border-color:var(--navy);color:var(--navy);}
.chip.active{background:var(--navy-deep);color:#fff;border-color:var(--navy-deep);}

/* ═══ grid ═══ */
.grid-wrap{max-width:1080px;margin:0 auto;padding:22px 20px 90px;}
.results-count{font-size:12px;color:var(--gray);margin-bottom:16px;}
.lawyer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:900px){.lawyer-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:600px){.lawyer-grid{grid-template-columns:1fr;}}

.lawyer-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(20,41,66,0.04);transition:transform .2s, box-shadow .2s;}
.lawyer-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(20,41,66,0.1);}
.lc-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.lc-avatar{width:50px;height:50px;border-radius:50%;background:var(--navy-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;color:var(--navy);}
.lc-name{font-size:14.5px;font-weight:800;color:var(--navy-deep);}
.lc-city{font-size:11px;color:var(--gray);margin-top:3px;}
.lc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.lc-tag{font-size:10.5px;padding:3px 10px;border-radius:20px;background:var(--gold-soft);color:#7a5c0e;border:1px solid rgba(201,162,39,0.3);}
.lc-bio{font-size:12px;color:var(--gray);line-height:1.7;flex:1;margin-bottom:14px;}
.lc-btn{background:var(--navy-deep);color:#fff;border:none;padding:11px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;transition:background .2s;}
.lc-btn:hover{background:var(--navy);}

.empty-state{text-align:center;padding:60px 20px;background:var(--panel);border:1px dashed var(--border);border-radius:16px;color:var(--gray);font-size:13px;line-height:1.9;}
.empty-state .em{font-size:34px;margin-bottom:12px;}

/* ═══ contact modal ═══ */
.modal-overlay{position:fixed;inset:0;background:rgba(18,24,31,0.55);display:none;align-items:center;justify-content:center;z-index:999;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-card{max-width:400px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px;position:relative;box-shadow:0 24px 60px rgba(20,41,66,0.25);}
.modal-close{position:absolute;top:16px;left:16px;background:none;border:none;color:var(--gray);font-size:18px;cursor:pointer;}
.modal-head{margin-bottom:18px;}
.modal-head .lawyer-name{font-size:15px;font-weight:800;color:var(--navy-deep);}
.modal-head .sub{font-size:11.5px;color:var(--gray);margin-top:4px;}
.m-field{margin-bottom:12px;}
.m-field label{display:block;font-size:11.5px;color:var(--gray);margin-bottom:6px;}
.m-field input, .m-field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--ink);font-family:'Cairo',sans-serif;font-size:13px;outline:none;direction:rtl;}
.m-field input:focus, .m-field textarea:focus{border-color:var(--navy);}
.m-field textarea{resize:vertical;min-height:70px;}
.m-field input[type="tel"]{direction:ltr;text-align:right;}
.m-err{font-size:11px;color:#c0392b;margin-bottom:8px;min-height:14px;}
.m-submit{width:100%;background:var(--navy-deep);color:#fff;border:none;padding:13px;border-radius:10px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:'Cairo',sans-serif;}
.m-submit.sent{background:var(--success);}
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html" class="nav-logo">LEGISTA<span>.</span></a>
  <span class="nav-sub">دور على محاميك</span>
</div>

<div class="search-head">
  <div class="search-inner">
    <h1>دور على <span>محاميك</span> المناسب دلوقتي</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="دور بالاسم أو التخصص...">
      <select id="citySelect"><option value="">كل المحافظات</option></select>
    </div>
  </div>
</div>

<div class="chip-row" id="chipRow"></div>

<div class="grid-wrap">
  <div class="results-count" id="resultsCount"></div>
  <div class="lawyer-grid" id="lawyerGrid"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-head">
      <div class="lawyer-name" id="modalLawyerName"></div>
      <div class="sub">اكتب طلبك وهيتواصل معاك على رقمك</div>
    </div>
    <div class="m-field"><label>اسمك</label><input type="text" id="mName" placeholder="اسمك بالكامل"></div>
    <div class="m-field"><label>رقم موبايلك</label><input type="tel" id="mPhone" placeholder="01000000000"></div>
    <div class="m-field"><label>مشكلتك باختصار</label><textarea id="mDesc" placeholder="احكي مشكلتك بالتفصيل..."></textarea></div>
    <div class="m-err" id="mErr"></div>
    <button class="m-submit" id="mSubmit">ابعت الطلب</button>
  </div>
</div>

<script type="module">
import './case-widget.js';

let allLawyers = [];
let activeCategory = 'all';

function renderChips() {
  const row = document.getElementById('chipRow');
  const cats = [{ key: 'all', label: 'الكل', emoji: '🔎' }, ...window.CaseWidget.LEAD_CATEGORIES];
  row.innerHTML = cats.map(c => `<div class="chip ${c.key === activeCategory ? 'active' : ''}" data-key="${c.key}">${c.emoji} ${window.CaseWidget.escapeHTML(c.label)}</div>`).join('');
  row.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeCategory = chip.dataset.key;
      renderChips();
      applyFilters();
    });
  });
}

function renderCities() {
  const sel = document.getElementById('citySelect');
  window.CaseWidget.EGYPT_GOVERNORATES.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', applyFilters);
}

function categoryLabel(key) {
  const c = window.CaseWidget.LEAD_CATEGORIES.find(x => x.key === key);
  return c ? c.label : key;
}

function applyFilters() {
  const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
  const city = document.getElementById('citySelect').value;

  let filtered = allLawyers.filter(l => {
    if (activeCategory !== 'all' && !(l.publicProfile?.specialties || []).includes(activeCategory)) return false;
    if (city && l.publicProfile?.city !== city) return false;
    if (searchTerm) {
      const hay = [(l.name || ''), ...(l.publicProfile?.specialties || []).map(categoryLabel), (l.publicProfile?.bio || '')].join(' ').toLowerCase();
      if (!hay.includes(searchTerm)) return false;
    }
    return true;
  });

  renderGrid(filtered);
}

function renderGrid(lawyers) {
  const grid = document.getElementById('lawyerGrid');
  document.getElementById('resultsCount').textContent = lawyers.length ? `${lawyers.length} محامي متاح` : '';

  if (!lawyers.length) {
    grid.innerHTML = '';
    grid.insertAdjacentHTML('afterend', `<div class="empty-state" id="emptyState"><div class="em">🧑‍⚖️</div>لسه مفيش محامين متسجّلين في التصنيف أو المحافظة دي — جرّب تصنيف تاني أو رجّع "الكل".</div>`);
    return;
  }
  document.getElementById('emptyState')?.remove();

  grid.innerHTML = lawyers.map((l, i) => `
    <div class="lawyer-card" data-idx="${i}">
      <div class="lc-top">
        <div class="lc-avatar">⚖️</div>
        <div>
          <div class="lc-name">${window.CaseWidget.escapeHTML(l.name || 'محامي')}</div>
          ${l.publicProfile?.city ? `<div class="lc-city">📍 ${window.CaseWidget.escapeHTML(l.publicProfile.city)}</div>` : ''}
        </div>
      </div>
      ${l.publicProfile?.specialties?.length ? `<div class="lc-tags">${l.publicProfile.specialties.map(s => `<span class="lc-tag">${window.CaseWidget.escapeHTML(categoryLabel(s))}</span>`).join('')}</div>` : ''}
      <div class="lc-bio">${window.CaseWidget.escapeHTML(l.publicProfile?.bio || 'محامي مسجّل على LEGISTA.')}</div>
      <button class="lc-btn" data-email="${l.email}" data-name="${window.CaseWidget.escapeHTML(l.name || 'محامي')}">تواصل معه</button>
    </div>`).join('');

  grid.querySelectorAll('.lc-btn').forEach(btn => {
    btn.addEventListener('click', () => openModal(btn.dataset.email, btn.dataset.name));
  });
}

let modalLawyerEmail = null;
function openModal(email, name) {
  modalLawyerEmail = email;
  document.getElementById('modalLawyerName').textContent = name;
  document.getElementById('mName').value = '';
  document.getElementById('mPhone').value = '';
  document.getElementById('mDesc').value = '';
  document.getElementById('mErr').textContent = '';
  const submitBtn = document.getElementById('mSubmit');
  submitBtn.textContent = 'ابعت الطلب';
  submitBtn.classList.remove('sent');
  submitBtn.disabled = false;
  document.getElementById('modalOverlay').classList.add('open');
}
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modalOverlay').classList.remove('open'));
document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') e.currentTarget.classList.remove('open'); });

document.getElementById('mSubmit').addEventListener('click', async () => {
  const name = document.getElementById('mName').value.trim();
  const phone = document.getElementById('mPhone').value.trim();
  const description = document.getElementById('mDesc').value.trim();
  if (!name) { document.getElementById('mErr').textContent = 'اكتب اسمك'; return; }
  if (!phone || phone.length < 10) { document.getElementById('mErr').textContent = 'اكتب رقم موبايل صحيح'; return; }
  if (!description) { document.getElementById('mErr').textContent = 'اكتب مشكلتك باختصار'; return; }

  const btn = document.getElementById('mSubmit');
  btn.disabled = true;
  const lead = await window.CaseWidget.submitLeadRequest({ name, phone, description, category: activeCategory === 'all' ? 'other' : activeCategory, city: document.getElementById('citySelect').value });
  await window.CaseWidget.assignLeadToLawyer(lead.id, modalLawyerEmail);
  btn.textContent = 'تم الإرسال ✓';
  btn.classList.add('sent');
  setTimeout(() => document.getElementById('modalOverlay').classList.remove('open'), 1200);
});

document.getElementById('searchInput').addEventListener('input', applyFilters);

async function boot() {
  allLawyers = await window.CaseWidget.listAllPublicLawyers();
  renderChips();
  renderCities();
  applyFilters();
}
boot();
</script>
</body>
</html>
