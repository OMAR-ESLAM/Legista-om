<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGISTA</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0A0D; --bg2: #121217; --gold: #D4AF37; --gold-soft: #F4E5A6;
  --cyber: #00E5FF; --white: #FFFFFF; --gray: #8A8A8F;
  --success: #00FFB2; --surface: #1A1A22; --border: rgba(212,175,55,0.15);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;}

.top-nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--border);}
.nav-back{font-size:11px;color:var(--cyber);text-decoration:none;letter-spacing:1px;border:1px solid rgba(0,229,255,0.2);padding:6px 14px;border-radius:8px;}
.nav-back:hover{background:rgba(0,229,255,0.07);}
.nav-logo{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:5px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;}

.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{max-width:820px;width:100%;text-align:center;}

.login-gate .icon{font-size:48px;margin-bottom:14px;}
.login-gate .page-title{font-size:20px;font-weight:900;}

.greet{font-size:24px;font-weight:900;margin-bottom:8px;}
.greet span{color:var(--gold);}
.date-line{font-size:12.5px;color:var(--gray);margin-bottom:36px;}

.hub-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:780px;margin:0 auto;}
@media (max-width:640px){.hub-row{grid-template-columns:1fr;}}

@property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes spinBorder { to { --angle: 360deg; } }

.hub-card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:44px 26px 34px;border-radius:26px;text-decoration:none;color:inherit;background:linear-gradient(145deg,#14141e 0%,#0a0f14 100%);overflow:hidden;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s;}
.hub-card::before{content:'';position:absolute;inset:0;border-radius:26px;padding:1.5px;background:conic-gradient(from var(--angle),rgba(0,229,255,0.9),rgba(0,229,255,0) 35%,rgba(0,229,255,0) 65%,rgba(0,229,255,0.9));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinBorder 3.5s linear infinite;pointer-events:none;z-index:1;}
.hub-card.gold::before{background:conic-gradient(from var(--angle),rgba(212,175,55,0.9),rgba(212,175,55,0) 35%,rgba(212,175,55,0) 65%,rgba(212,175,55,0.9));}
.hub-card:hover::before{animation-duration:1.4s;}
.hub-card::after{content:'';position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,0.16),transparent 70%);pointer-events:none;z-index:0;transition:opacity .35s;}
.hub-card.gold::after{background:radial-gradient(circle,rgba(212,175,55,0.18),transparent 70%);}
.hub-card:hover{transform:translateY(-6px);}
.hub-card.cyan:hover{box-shadow:0 24px 64px rgba(0,229,255,0.16);}
.hub-card.gold:hover{box-shadow:0 24px 64px rgba(212,175,55,0.18);}
.hub-card>*{position:relative;z-index:2;}
.hub-shine{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,0.07),transparent);transform:skewX(-15deg);transition:left .65s ease;z-index:1;pointer-events:none;}
.hub-card:hover .hub-shine{left:130%;}

.hub-radar{position:relative;width:96px;height:96px;flex-shrink:0;}
.hub-radar-ring{position:absolute;border-radius:50%;border:1px solid rgba(0,229,255,0.3);}
.hub-card.gold .hub-radar-ring{border-color:rgba(212,175,55,0.32);}
.hub-radar-ring.r1{width:96px;height:96px;}
.hub-radar-ring.r2{width:64px;height:64px;top:16px;left:16px;}
.hub-radar-ring.r3{width:34px;height:34px;top:31px;left:31px;animation:hubPulseCyan 2.4s ease-out infinite;}
.hub-card.gold .hub-radar-ring.r3{animation-name:hubPulseGold;}
.hub-radar-core{position:absolute;top:24px;left:24px;z-index:2;width:48px;height:48px;border-radius:50%;background:rgba(0,229,255,0.14);display:flex;align-items:center;justify-content:center;font-size:22px;}
.hub-card.gold .hub-radar-core{background:rgba(212,175,55,0.14);}
.hub-radar-sweep{position:absolute;width:48px;height:48px;top:0;left:0;background:conic-gradient(from 0deg,rgba(0,229,255,0.55),transparent 45%);border-radius:50% 0 0 0;transform-origin:bottom right;animation:hubSweep 3s linear infinite;opacity:.7;}
.hub-card.gold .hub-radar-sweep{background:conic-gradient(from 0deg,rgba(212,175,55,0.55),transparent 45%);}
.hub-card:hover .hub-radar-sweep{animation-duration:1.2s;}
@keyframes hubSweep{to{transform:rotate(360deg);}}
@keyframes hubPulseCyan{0%{box-shadow:0 0 0 0 rgba(0,229,255,0.35);}70%{box-shadow:0 0 0 20px rgba(0,229,255,0);}100%{box-shadow:0 0 0 0 rgba(0,229,255,0);}}
@keyframes hubPulseGold{0%{box-shadow:0 0 0 0 rgba(212,175,55,0.35);}70%{box-shadow:0 0 0 20px rgba(212,175,55,0);}100%{box-shadow:0 0 0 0 rgba(212,175,55,0);}}

.hub-eyebrow{font-size:10.5px;letter-spacing:3.5px;color:var(--cyber);font-weight:700;}
.hub-card.gold .hub-eyebrow{color:var(--gold);}
.hub-title{font-size:19.5px;font-weight:900;color:var(--white);}
.hub-sub{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.7;}
.hub-arrow{margin-top:4px;width:38px;height:38px;border-radius:50%;background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.25);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--cyber);transition:transform .3s,box-shadow .3s;}
.hub-card.gold .hub-arrow{background:rgba(212,175,55,0.08);border-color:rgba(212,175,55,0.28);color:var(--gold);}
.hub-card:hover .hub-arrow{transform:translateX(-5px);}
.hub-card.cyan:hover .hub-arrow{box-shadow:0 0 20px rgba(0,229,255,0.25);}
.hub-card.gold:hover .hub-arrow{box-shadow:0 0 20px rgba(212,175,55,0.25);}

.footer-link{margin-top:30px;}
.footer-link a{font-size:12px;color:var(--gray);text-decoration:none;border-bottom:1px dashed var(--border);padding-bottom:2px;}
.footer-link a:hover{color:var(--cyber);}
</style>
</head>
<body>

<div class="top-nav">
  <span></span>
  <a href="#" class="nav-logo">LEGISTA</a>
</div>

<div class="wrap">

  <div id="loginGate" class="card login-gate" style="display:none;">
    <div class="icon">🔒</div>
    <div class="page-title">سجّل الدخول عشان تستخدم مكتبك</div>
  </div>

  <div id="content" class="card" style="display:none;">
    <div class="greet"><span id="greetPhrase"></span>، <span id="greetName"></span> 👋</div>
    <div class="date-line" id="todayDate"></div>

    <div class="hub-row">
      <a href="case-file.html" class="hub-card gold">
        <div class="hub-shine"></div>
        <div class="hub-radar">
          <div class="hub-radar-ring r1"></div>
          <div class="hub-radar-ring r2"></div>
          <div class="hub-radar-ring r3"></div>
          <div class="hub-radar-sweep"></div>
          <div class="hub-radar-core">📁</div>
        </div>
        <p class="hub-eyebrow">CASE MANAGEMENT</p>
        <div class="hub-title">إدارة قضاياك</div>
        <p class="hub-sub">كل ملفات القضايا والمستندات</p>
        <div class="hub-arrow">←</div>
      </a>
      <a href="staff.html" class="hub-card cyan">
        <div class="hub-shine"></div>
        <div class="hub-radar">
          <div class="hub-radar-ring r1"></div>
          <div class="hub-radar-ring r2"></div>
          <div class="hub-radar-ring r3"></div>
          <div class="hub-radar-sweep"></div>
          <div class="hub-radar-core">👥</div>
        </div>
        <p class="hub-eyebrow">OFFICE TEAM</p>
        <div class="hub-title">إدارة محاميينك وموظفيك</div>
        <p class="hub-sub">ضيف فريق المكتب وابعتلهم بوابتهم الشخصية</p>
        <div class="hub-arrow">←</div>
      </a>
    </div>

    <div class="footer-link"><a href="dashboard.html">لوحة التحكم والإحصائيات ←</a></div>
  </div>

</div>

<script type="module">
import './case-widget.js';

function getUser() {
  const saved = localStorage.getItem('legista_user');
  if (!saved) return null;
  try { return JSON.parse(saved); } catch (e) { return null; }
}

function greetingPhrase() {
  const h = new Date().getHours();
  if (h < 12) return 'صباح الخير';
  if (h < 18) return 'مساء الخير';
  return 'مساء الخير';
}

function getDisplayName(user) {
  if (user.name) return user.name;
  const guess = (user.email || '').split('@')[0];
  return guess;
}

function boot() {
  const user = getUser();
  if (!user) {
    document.getElementById('loginGate').style.display = 'block';
    return;
  }
  document.getElementById('content').style.display = 'block';
  document.getElementById('greetPhrase').textContent = greetingPhrase();
  document.getElementById('greetName').textContent = getDisplayName(user);
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
boot();
</script>
</body>
</html>
