<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الموظفين | LEGISTA</title>
<meta name="description" content="ضيف محاميين ومتدربين وموظفين مكتبك، وابعتلهم لينك شخصي يوريهم مهام شغلهم بس.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0A0D; --bg2: #121217; --gold: #D4AF37; --gold-soft: #F4E5A6;
  --cyber: #00E5FF; --white: #FFFFFF; --gray: #8A8A8F;
  --success: #00FFB2; --surface: #1A1A22; --border: rgba(212,175,55,0.15);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--white);}
a{color:inherit;}

.top-nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:200;}
.nav-back{font-size:11px;color:var(--cyber);text-decoration:none;letter-spacing:1px;border:1px solid rgba(0,229,255,0.2);padding:6px 14px;border-radius:8px;}
.nav-back:hover{background:rgba(0,229,255,0.07);}
.nav-section{font-size:11px;letter-spacing:3px;color:var(--gray);font-weight:600;}
.nav-logo{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:5px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;}

.wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px;}
.page-title{font-size:22px;font-weight:900;margin-bottom:6px;}
.page-title span{color:var(--gold);}
.page-sub{font-size:13px;color:var(--gray);margin-bottom:28px;}

.login-gate{text-align:center;padding:100px 20px;}
.login-gate .icon{font-size:48px;margin-bottom:14px;}

.add-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:30px;}
.add-box .lbl{font-size:11px;color:var(--gold);letter-spacing:1px;font-weight:800;margin-bottom:14px;}
.add-form{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px;align-items:end;}
@media (max-width:720px){.add-form{grid-template-columns:1fr;}}
.cw-field{display:flex;flex-direction:column;gap:6px;}
.cw-field label{font-size:11.5px;color:var(--gray);}
.cw-field input, .cw-field select{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 13px;color:var(--white);font-family:'Cairo',sans-serif;font-size:13px;direction:rtl;outline:none;}
.cw-field input:focus, .cw-field select:focus{border-color:var(--cyber);}
.btn-add-staff{background:linear-gradient(90deg,var(--gold),var(--gold-soft));color:#0A0A0D;border:none;padding:11px 22px;border-radius:9px;font-family:'Cairo',sans-serif;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;height:41px;}

.role-hint{font-size:11px;color:var(--gray);margin-top:10px;line-height:1.8;}
.role-hint b{color:var(--cyber);}

.section-title{font-size:15px;font-weight:800;margin-bottom:14px;}

.staff-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;cursor:pointer;transition:border-color .2s, transform .2s;}
.staff-card:hover{border-color:rgba(212,175,55,0.4);transform:translateY(-1px);}
.staff-card-inner{display:flex;align-items:center;gap:14px;min-width:0;}
.staff-avatar{flex-shrink:0;width:48px;height:48px;border-radius:14px;background:rgba(212,175,55,0.1);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;}
.staff-main{min-width:0;}
.staff-name{font-size:14.5px;font-weight:800;margin-bottom:4px;}
.staff-role{display:inline-block;font-size:10.5px;padding:3px 11px;border-radius:20px;background:rgba(0,229,255,0.08);color:var(--cyber);border:1px solid rgba(0,229,255,0.2);font-weight:700;margin-inline-end:6px;}
.staff-phone{font-size:11.5px;color:var(--gray);margin-top:6px;}
.staff-tabs-preview{font-size:10.5px;color:var(--gray);margin-top:8px;line-height:1.9;}
.staff-actions{display:flex;gap:8px;flex-shrink:0;}
.btn-sm{font-size:12px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--white);cursor:pointer;font-family:'Cairo',sans-serif;white-space:nowrap;}
.btn-sm.gold{color:var(--gold);border-color:rgba(212,175,55,0.35);}
.btn-sm.danger{color:#ff6b6b;border-color:rgba(255,107,107,0.3);}

.empty-row{text-align:center;padding:40px 20px;color:var(--gray);font-size:13px;background:var(--bg2);border:1px dashed var(--border);border-radius:14px;}
</style>
</head>
<body>

<div class="top-nav">
  <a href="dashboard.html" class="nav-back">← لوحة التحكم</a>
  <span class="nav-section">◈ إدارة الموظفين</span>
  <a href="index.html" class="nav-logo">LEGISTA</a>
</div>

<div class="wrap">

  <div id="loginGate" class="login-gate" style="display:none;">
    <div class="icon">🔒</div>
    <div class="page-title">سجّل الدخول لإدارة موظفينك</div>
  </div>

  <div id="content" style="display:none;">
    <div class="page-title">إدارة <span>محاميينك وموظفينك</span></div>
    <div class="page-sub">ضيف أي حد بيشتغل معاك في المكتب — محامي، متدرب، سكرتارية، محاسب أو غيرهم — وابعتله لينك شخصي يوريه شغله بس.</div>

    <div class="add-box">
      <div class="lbl">◈ إضافة موظف جديد</div>
      <div class="add-form">
        <div class="cw-field">
          <label>الاسم</label>
          <input id="stName" placeholder="اسم الموظف">
        </div>
        <div class="cw-field">
          <label>المهنة / الدور</label>
          <select id="stRole"></select>
        </div>
        <div class="cw-field">
          <label>رقم الموبايل (اختياري)</label>
          <input id="stPhone" placeholder="01000000000">
        </div>
        <button class="btn-add-staff" id="btnAddStaff">+ إضافة</button>
      </div>
      <div class="role-hint" id="roleHint"></div>
    </div>

    <div class="section-title">فريق المكتب <span id="staffCount" style="color:var(--gray);font-weight:600;font-size:12px;"></span></div>
    <div id="staffList"></div>
    <div id="staffEmpty" class="empty-row" style="display:none;">لسه معندكش موظفين مضافين. ضيف أول واحد من فوق ⬆️</div>
  </div>

</div>

<script type="module">
import './case-widget.js';

function getUser() {
  const saved = localStorage.getItem('legista_user');
  if (!saved) return null;
  try { return JSON.parse(saved); } catch (e) { return null; }
}

let currentUser = null;

function populateRoleSelect() {
  const sel = document.getElementById('stRole');
  sel.innerHTML = window.CaseWidget.STAFF_ROLES.map(r => `<option value="${r.key}">${r.label}</option>`).join('');
  updateRoleHint();
  sel.addEventListener('change', updateRoleHint);
}

function updateRoleHint() {
  const roleKey = document.getElementById('stRole').value;
  const role = window.CaseWidget.getRoleDef(roleKey);
  document.getElementById('roleHint').innerHTML = role
    ? `تابات بوابة "<b>${window.CaseWidget.escapeHTML(role.label)}</b>": ${role.tabs.map(window.CaseWidget.escapeHTML).join(' · ')}`
    : '';
}

async function refreshStaffList() {
  const staff = await window.CaseWidget.listStaff(currentUser.email);
  document.getElementById('staffCount').textContent = staff.length ? `(${staff.length})` : '';
  document.getElementById('staffEmpty').style.display = staff.length ? 'none' : 'block';
  const list = document.getElementById('staffList');
  list.innerHTML = staff.map(s => {
    const role = window.CaseWidget.getRoleDef(s.role);
    const link = `${location.origin}${location.pathname.replace('staff.html', '')}staff-portal.html?staff=${s.id}`;
    return `
    <div class="staff-card" data-id="${s.id}" data-link="${link}">
      <div class="staff-card-inner">
        <div class="staff-avatar">${role ? role.emoji : '👤'}</div>
        <div class="staff-main">
          <div class="staff-name">${window.CaseWidget.escapeHTML(s.name || 'بدون اسم')}</div>
          <span class="staff-role">${role ? window.CaseWidget.escapeHTML(role.label) : s.role}</span>
          ${s.phone ? `<span class="staff-phone">📱 ${window.CaseWidget.escapeHTML(s.phone)}</span>` : ''}
          ${role ? `<div class="staff-tabs-preview">◈ ${role.tabs.map(window.CaseWidget.escapeHTML).join(' · ')}</div>` : ''}
        </div>
      </div>
      <div class="staff-actions">
        <button class="btn-sm gold copy-link-btn">🔗 نسخ لينك الموظف</button>
        <button class="btn-sm danger del-staff-btn">حذف</button>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.staff-card').forEach(card => {
    card.addEventListener('click', () => {
      location.href = card.dataset.link;
    });
  });
  list.querySelectorAll('.copy-link-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const card = btn.closest('.staff-card');
      try {
        await navigator.clipboard.writeText(card.dataset.link);
        window.CaseWidget.toast('اتنسخ اللينك ✓ ابعته للموظف');
      } catch (e) {
        window.CaseWidget.toast('اللينك: ' + card.dataset.link);
      }
    });
  });
  list.querySelectorAll('.del-staff-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('هتحذف الموظف ده من قايمة المكتب. متأكد؟')) return;
      const id = btn.closest('.staff-card').dataset.id;
      await window.CaseWidget.deleteStaff(id);
      refreshStaffList();
    });
  });
}

document.getElementById('btnAddStaff').addEventListener('click', async () => {
  const name = document.getElementById('stName').value.trim();
  if (!name) { window.CaseWidget.toast('لازم تكتب اسم الموظف'); return; }
  const role = document.getElementById('stRole').value;
  const phone = document.getElementById('stPhone').value.trim();
  const btn = document.getElementById('btnAddStaff');
  btn.disabled = true;
  await window.CaseWidget.createStaff(currentUser.email, { name, role, phone });
  btn.disabled = false;
  document.getElementById('stName').value = '';
  document.getElementById('stPhone').value = '';
  refreshStaffList();
});

async function boot() {
  currentUser = getUser();
  if (!currentUser) {
    document.getElementById('loginGate').style.display = 'block';
    return;
  }
  document.getElementById('content').style.display = 'block';
  populateRoleSelect();
  await refreshStaffList();
}
boot();
</script>
</body>
</html>
